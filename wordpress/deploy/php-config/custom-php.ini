; ============================================================
; Cấu hình PHP tối ưu riêng cho container wp_woo (WooCommerce)
; Mount vào /usr/local/etc/php/conf.d/zz-custom-php.ini
; ============================================================
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
; WooCommerce checkout / product variation form có rất nhiều field
max_input_vars = 3000
; Giảm rủi ro timeout khi export đơn hàng / tạo báo cáo doanh thu
max_input_time = 300
